[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siegesense-engine"
version = "0.1.0"
description = "SiegeSense local analysis engine"
requires-python = ">=3.12"
dependencies = ["websockets>=15", "pydantic>=2.8", "psutil>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/siegesense_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
